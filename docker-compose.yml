services:
  security-service:
    build: .
    container_name: accesorios-dm-security-qa
    restart: unless-stopped
    ports:
      - "8889:8889"
    environment:
      - DATABASE_URL=postgresql://admin:admin123@accesorios-dm-postgres-qa:5432/accesorios_dm_db
      - SECRET_KEY=qa-secret-key
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - PORT=8889
      - HOST=0.0.0.0
    volumes:
      - ./app:/app/app
    networks:
      - accesorios-dm-net-qa

networks:
  accesorios-dm-net-qa:
    external: true
    name: accesorios-dm-database_accesorios-network-qa